# ─── greencross-spiff — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out greencross-spiff
        uses: actions/checkout@v4
        with:
          path: greencross-spiff

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the gate
        working-directory: greencross-spiff
        run: sh ./gx-preflight.sh

      # Say what did NOT run. A green tick reports that every test EXITED 0, which is not the same
      # as every test having COVERED something: a suite that skips prints a pass line and looks
      # identical to one that ran.
      #
      # The patterns are anchored deliberately. Three suites here carry assertion LABELS containing
      # the word "skipped" ("a nameless row is skipped") — those are passes, and a looser grep would
      # flag them until the ⚠️ meant nothing. secret_leak_test.js does skip one comparison in CI,
      # against the live .gx_deploy_secret, which is gitignored and stays that way; the checks that
      # matter (the file is ignored, no credential literals are committed) run regardless — but it
      # is a skip, so its exact wording is in the pattern too. Written without it, this step showed
      # that file a green ✅ in CI while one of its comparisons had not run: a reporter that hides a
      # skip is worse than no reporter, because it is the thing you check INSTEAD of looking.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-spiff
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              if printf '%s' "$out" | grep -qiE '^SKIP|not a sibling|checkout not present|live-value check skipped'; then
                echo "- ⚠️ \`$t\` — **SKIPPED**: $(printf '%s' "$out" | grep -iE '^SKIP|not a sibling|checkout not present|live-value check skipped' | head -1)"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
