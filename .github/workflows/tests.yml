# ─── greencross-spiff — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out greencross-spiff
        uses: actions/checkout@v7
        with:
          path: greencross-spiff

      # ONE SIBLING, AND NO SECRET. store_cache_fallback_test.js runs the REAL gx-stores.js out of
      # greencross-gx-theme to prove a failed stores fetch still serves cached display names — the bug
      # that rendered every store as its slug ("bend" for Century) on 2026-09-08. Without this checkout
      # that half of the suite skips, so CI printed a pass for a check that had never run: coverage
      # present locally, where the sibling happens to sit beside this repo, and silently absent from the
      # one gate `git push --no-verify` cannot walk past.
      #
      # greencross-gx-theme is PUBLIC, so actions/checkout reaches it with the default GITHUB_TOKEN and
      # there is nothing to create, rotate or leak. Modeled on the hub's workflow, where siblings are
      # checked out at `path: greencross-<name>` beside a main checkout that must itself be pathed —
      # hence `path: greencross-spiff` above, which is what puts the two repos side by side the way the
      # test's `..` lookup expects.
      #
      # DELIBERATELY NOT greencross-command-center: it is PRIVATE, the default token cannot reach it,
      # and the cross-app contract coverage it would unlock already runs in the hub's own CI where all
      # seven repos are checked out. A suite here that still says SKIP for a hub sibling is correct to.
      - name: Check out greencross-gx-theme
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-gx-theme
          path: greencross-gx-theme

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the gate
        working-directory: greencross-spiff
        run: sh ./gx-preflight.sh

      # Say what did NOT run. A green tick reports that every test EXITED 0, which is not the same
      # as every test having COVERED something: a suite that skips prints a pass line and looks
      # identical to one that ran.
      #
      # The patterns are anchored deliberately. Three suites here carry assertion LABELS containing
      # the word "skipped" ("a nameless row is skipped") — those are passes, and a looser grep would
      # flag them until the ⚠️ meant nothing. secret_leak_test.js does skip one comparison in CI,
      # against the live .gx_deploy_secret, which is gitignored and stays that way; the checks that
      # matter (the file is ignored, no credential literals are committed) run regardless — but it
      # is a skip, so its exact wording is in the pattern too. Written without it, this step showed
      # that file a green ✅ in CI while one of its comparisons had not run: a reporter that hides a
      # skip is worse than no reporter, because it is the thing you check INSTEAD of looking.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-spiff
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              # ONE MARKER, EVERY REPO: a skip is a line whose first non-space word is SKIP.
              # Column 0 means the whole suite could not run; indented means it ran but had to pass
              # over part of itself — so the COUNT matters, not just the fact.
              #
              # This used to be five different greps across eight repos, each matching the PHRASING
              # its own tests happened to use ("not a sibling", "checkout not present", "live-value
              # check skipped") — five guesses at wording that nothing kept in step, and a suite that
              # reworded its skip would silently go back to being reported as having run. Two suites
              # (crew's drift check, spiff's live-value check) were already in that state and were
              # given the marker in the same pass.
              #
              # Case-sensitive on purpose: assertion labels are lowercase prose ("a nameless row is
              # skipped") and a -i match would flag those until nobody read the warning.
              SKIPRE='^SKIP|^ +SKIP '
              n="$(printf '%s' "$out" | grep -cE "$SKIPRE" || true)"
              if [ "${n:-0}" -gt 0 ]; then
                echo "- ⚠️ \`$t\` — **$n SKIPPED**: $(printf '%s' "$out" | grep -E "$SKIPRE" | head -1 | sed 's/^ *//')"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
            echo ""
            # Say whether the sibling actually arrived. The checkout step failing is the one way this
            # repo goes back to reporting a pass for a check that did not run, and a ⚠️ line above only
            # appears if the suite is asked to run at all — so name the input directly.
            if [ -d "../greencross-gx-theme" ]; then
              echo "greencross-gx-theme present — the shared-stores half of store_cache_fallback ran here."
            else
              echo "> **Sibling absent: greencross-gx-theme.** It is public and needs no token, so this"
              echo "> means the checkout step failed — not that the coverage is optional."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
