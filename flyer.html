</main>

<!-- Shared maintenance gate (core-admin note, 2026-08-28). Does nothing today: it fetches the
     flag on every load and anything unreadable counts as UP, so a bad minute of GitHub's CDN cannot
     manufacture an outage. The value is entirely in already being wired when something breaks — the
     app that skipped this is the one still showing a stack trace to a store.
     Overlays at z-index 10000; the highest rule in this app is 60, so nothing here fights it. It sits
     ABOVE the sign-in gate deliberately: being told the app is down should not require signing in.
     Preview with ?gxmaint=on, bypass with ?gxmaint=off. -->
<script src="https://greencrosscanna.github.io/greencross-gx-theme/gx-maintenance.js"></script>
